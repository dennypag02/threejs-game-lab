<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>Three.js Game Lab</title><style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#8bd1ef;font:16px system-ui;color:white}#hud{position:absolute;top:16px;left:16px;background:#17283ccc;padding:12px 16px;border-radius:12px;z-index:2}#win{display:none;position:absolute;inset:0;z-index:3;background:#0b1b2bcc;align-items:center;justify-content:center;flex-direction:column;font-size:30px;text-align:center}#touch{position:absolute;bottom:24px;left:24px;z-index:2;display:grid;grid-template-columns:repeat(3,54px);gap:6px;touch-action:none}button{border:0;border-radius:10px;padding:10px;background:#f4c84d;font-weight:bold}#touch button{height:54px;background:#203b58cc;color:white;font-size:24px}#touch .empty{visibility:hidden}</style></head>
<body><div id="hud"><strong id="score">Stars: 0 / 3</strong><div>WASD, arrows, or touch to move</div></div><div id="win">Island complete!<p>All three stars collected.</p><button onclick="location.reload()">Play again</button></div><div id="touch"><span class="empty"></span><button data-key="arrowup">▲</button><span class="empty"></span><button data-key="arrowleft">◀</button><button data-key="arrowdown">▼</button><button data-key="arrowright">▶</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x8bd1ef);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,.1,100);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xffffff,0x456b88,2));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(-7,14,9);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-14;sun.shadow.camera.right=14;sun.shadow.camera.top=14;sun.shadow.camera.bottom=-14;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.8});
function box(w,h,d,m,x,y,z){const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);mesh.position.set(x,y,z);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
box(18,1.5,18,material(0x87664b),0,-1.1,0);box(18,.35,18,material(0x73bc60),0,-.15,0);
const trunk=material(0x80553b),leaf=material(0x31865b);for(const [x,z] of [[-6,-5],[6,-6],[-6,5],[5,5]]){box(.45,1.8,.45,trunk,x,.9,z);const tree=new THREE.Mesh(new THREE.ConeGeometry(1.25,2.7,6),leaf);tree.position.set(x,2.7,z);tree.castShadow=true;scene.add(tree)}
const player=new THREE.Group(),body=new THREE.Mesh(new THREE.CapsuleGeometry(.42,.7,4,8),material(0x3769e8));body.position.y=.8;body.castShadow=true;player.add(body);scene.add(player);
const gold=new THREE.MeshStandardMaterial({color:0xffd04d,emissive:0x996600,metalness:.3});const stars=[[ -4,-2],[4,-1],[1,5]].map(([x,z])=>{const mesh=new THREE.Mesh(new THREE.OctahedronGeometry(.55),gold);mesh.position.set(x,1.1,z);scene.add(mesh);return mesh});
const keys=new Set();addEventListener('keydown',e=>{if(e.key.startsWith('Arrow'))e.preventDefault();keys.add(e.key.toLowerCase())});addEventListener('keyup',e=>keys.delete(e.key.toLowerCase()));addEventListener('blur',()=>keys.clear());document.querySelectorAll('[data-key]').forEach(b=>{const key=b.dataset.key;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);keys.add(key)});for(const event of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(event,()=>keys.delete(key))});
let score=0;const clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);const dt=Math.min(clock.getDelta(),.05);let x=Number(keys.has('d')||keys.has('arrowright'))-Number(keys.has('a')||keys.has('arrowleft')),z=Number(keys.has('s')||keys.has('arrowdown'))-Number(keys.has('w')||keys.has('arrowup'));const len=Math.hypot(x,z);if(len&&score<3){player.position.x=THREE.MathUtils.clamp(player.position.x+x/len*5*dt,-8.2,8.2);player.position.z=THREE.MathUtils.clamp(player.position.z+z/len*5*dt,-8.2,8.2);player.rotation.y=Math.atan2(-x,-z)}for(const star of [...stars]){star.rotation.y+=dt*2;star.position.y=1.1+Math.sin(clock.elapsedTime*2+star.position.x)*.18;if(Math.hypot(star.position.x-player.position.x,star.position.z-player.position.z)<.95){scene.remove(star);stars.splice(stars.indexOf(star),1);document.querySelector('#score').textContent='Stars: '+(++score)+' / 3';if(score===3)document.querySelector('#win').style.display='flex'}}camera.position.lerp(new THREE.Vector3(player.position.x+10,12,player.position.z+14),Math.min(1,dt*3));camera.lookAt(player.position.x,.5,player.position.z);renderer.render(scene,camera)}camera.position.set(10,12,14);frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
